<form class="selector" [formGroup]="form">
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Desde</mat-label>
    <input matInput type="date" formControlName="desde" [max]="hoy" />
  </mat-form-field>

  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Hasta</mat-label>
    <input matInput type="date" formControlName="hasta" [max]="hoy" />
  </mat-form-field>

  <div class="atajos">
    @for (dias of atajos; track dias) {
      <button mat-stroked-button type="button" (click)="elegirUltimos(dias)">Últimos {{ dias }} días</button>
    }
  </div>
</form>

@if (mensajeError(); as mensaje) {
  <p class="error-texto" role="alert">{{ mensaje }}</p>
}
